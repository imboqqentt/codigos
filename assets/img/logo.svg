<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 260" role="img" aria-label="MG Ingeniería">
  <title>MG Ingeniería — Cálculo Estructural</title>
  <defs>
    <linearGradient id="mgSilver" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="55%" stop-color="#e6ebf2"/>
      <stop offset="100%" stop-color="#b9c3d1"/>
    </linearGradient>
    <linearGradient id="mgGold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e6bd6d"/>
      <stop offset="50%" stop-color="#c8952f"/>
      <stop offset="100%" stop-color="#9c6f1d"/>
    </linearGradient>
  </defs>

  <!-- anillo abierto -->
  <path d="M130 22 a108 108 0 1 0 76 32"
        fill="none" stroke="url(#mgSilver)" stroke-width="9" stroke-linecap="round"/>

  <!-- edificios -->
  <g fill="url(#mgSilver)" opacity=".95">
    <rect x="103" y="140" width="20" height="74" rx="2"/>
    <rect x="127" y="118" width="24" height="96" rx="2"/>
    <rect x="155" y="152" width="18" height="62" rx="2"/>
  </g>
  <g fill="#0a1f44" opacity=".85">
    <rect x="108" y="150" width="4" height="6"/><rect x="115" y="150" width="4" height="6"/>
    <rect x="108" y="163" width="4" height="6"/><rect x="115" y="163" width="4" height="6"/>
    <rect x="108" y="176" width="4" height="6"/><rect x="115" y="176" width="4" height="6"/>
    <rect x="132" y="128" width="5" height="7"/><rect x="141" y="128" width="5" height="7"/>
    <rect x="132" y="143" width="5" height="7"/><rect x="141" y="143" width="5" height="7"/>
    <rect x="132" y="158" width="5" height="7"/><rect x="141" y="158" width="5" height="7"/>
    <rect x="132" y="173" width="5" height="7"/><rect x="141" y="173" width="5" height="7"/>
    <rect x="159" y="162" width="4" height="6"/><rect x="166" y="162" width="4" height="6"/>
    <rect x="159" y="175" width="4" height="6"/><rect x="166" y="175" width="4" height="6"/>
  </g>

  <!-- letras -->
  <text x="88" y="168" text-anchor="middle"
        font-family="Georgia, 'Times New Roman', serif" font-size="150" font-weight="700"
        fill="url(#mgSilver)">M</text>
  <text x="176" y="182" text-anchor="middle"
        font-family="Georgia, 'Times New Roman', serif" font-size="132" font-weight="700"
        fill="url(#mgGold)">G</text>
</svg>
